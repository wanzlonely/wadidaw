name: Build WALZPAY Listener APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-listener/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-listener

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK to walzpay.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/walzpay.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: walzpay-apk
          path: android-listener/dist/walzpay.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### WALZPAY APK siap" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Buka run ini → **Artifacts** → **walzpay-apk**" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Extract ZIP → dapat **walzpay.apk**" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Install di HP" >> "$GITHUB_STEP_SUMMARY"
