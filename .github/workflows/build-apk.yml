name: Build WALZPAY Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-listener

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/walzpay-release.jks.b64 > keystore/walzpay-release.jks
          ls -la keystore/

      - name: Build signed release APK
        env:
          WALZPAY_STORE_PASSWORD: "WalzPay#Release2026!"
          WALZPAY_KEY_PASSWORD: "WalzPay#Release2026!"
          WALZPAY_KEY_ALIAS: walzpay
        run: gradle assembleRelease --stacktrace

      - name: Package APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          cp "$APK" dist/WALZPAY-3.1.4.apk
          cp "$APK" dist/walzpay-release.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: walzpay-release-apk
          path: |
            android-listener/dist/WALZPAY-3.1.4.apk
            android-listener/dist/walzpay-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.1.4' }}
          name: WALZPAY ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.1.4' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## WALZPAY Listener **3.1.4** (Release)

            Aplikasi Android resmi untuk memantau notifikasi pembayaran → webhook dashboard.

            ### Unduh & install (publik)
            1. Unduh **`WALZPAY-3.1.4.apk`** dari Assets di bawah
            2. Settings HP → izinkan **Install unknown apps**
            3. Buka APK → Install
            4. Buka app → izinkan **Akses notifikasi** + **Tanpa batasan baterai**
            5. Login / isi API key dari website **Setel**

            ### Perubahan 3.1.4
            - Bottom navigation pas di semua perangkat (safe-area)
            - Build **signed release** siap distribusi publik
            - Cache web 3.1.4

            Website: https://walzpaynew.vercel.app
          files: |
            android-listener/dist/WALZPAY-3.1.4.apk
            android-listener/dist/walzpay-release.apk

      - name: Summary
        run: |
          echo "### WALZPAY Release APK siap" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: **walzpay-release-apk**" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: **WALZPAY-3.1.4.apk** (signed release)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public: tab **Releases** → unduh APK" >> "$GITHUB_STEP_SUMMARY"
