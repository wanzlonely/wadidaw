<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="220" fill="#0B1220"/>
  
  <!-- Soft inner glow / depth -->
  <rect x="40" y="40" width="944" height="944" rx="180" fill="#0B1220" stroke="#1a2744" stroke-width="2"/>
  
  <!-- Main W letter with gradient -->
  <defs>
    <linearGradient id="wGrad" x1="200" y1="200" x2="800" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="150" y1="700" x2="900" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Stylized W (inspired by the redesigned logo) -->
  <path d="M 220 280 
           C 240 280, 260 290, 275 320
           L 380 620
           L 480 380
           L 580 620
           L 685 320
           C 700 290, 720 280, 740 280
           L 800 280
           C 820 280, 830 295, 820 315
           L 700 720
           C 690 750, 670 770, 640 770
           L 580 770
           C 555 770, 540 755, 530 730
           L 480 560
           L 430 730
           C 420 755, 405 770, 380 770
           L 320 770
           C 290 770, 270 750, 260 720
           L 140 315
           C 130 295, 140 280, 160 280
           Z" 
        fill="url(#wGrad)" filter="url(#softShadow)"/>
  
  <!-- Cyan swoosh -->
  <path d="M 180 720 
           Q 350 680, 480 640
           Q 650 590, 820 480
           Q 860 450, 880 420
           " 
        stroke="url(#swooshGrad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        fill="none"
        filter="url(#softShadow)"/>
  
  <!-- Sparkle / star -->
  <g transform="translate(820, 340)">
    <path d="M0,-28 L8,-8 L28,0 L8,8 L0,28 L-8,8 L-28,0 L-8,-8 Z" fill="#22D3EE"/>
    <circle cx="0" cy="0" r="6" fill="#67E8F9"/>
  </g>
</svg>
